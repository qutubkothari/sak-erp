# =====================================================
# FREE Automated Database Backup via GitHub Actions
# Runs daily at midnight UTC and saves to GitHub Releases
# =====================================================

name: Database Backup

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database backup
        id: backup
        env:
          # GitHub Secrets needed:
          # SUPABASE_HOST: db.nwkaruzvzwwuftjquypk.supabase.co
          # SUPABASE_PASSWORD: (your database password)
          PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M)
          BACKUP_NAME="sak-erp-backup-$DATE.sql"
          pg_dump -h ${{ secrets.SUPABASE_HOST }} \
            -U postgres \
            -d postgres \
            --clean --if-exists \
            --no-owner --no-privileges \
            -f "$BACKUP_NAME"
          
          # Compress
          gzip "$BACKUP_NAME"
          
          # Save filename for next step
          echo "backup_file=sak-erp-backup-$DATE.sql.gz" >> $GITHUB_OUTPUT
          echo "backup_date=$DATE" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: db-backup-${{ github.run_number }}
          name: Database Backup ${{ steps.backup.outputs.backup_date }}
          files: ${{ steps.backup.outputs.backup_file }}
          body: |
            Automated database backup
            Date: ${{ steps.backup.outputs.backup_date }}
            File: ${{ steps.backup.outputs.backup_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
